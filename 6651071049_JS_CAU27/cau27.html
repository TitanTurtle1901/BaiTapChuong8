<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câu 27</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 12px; }
  h2 { color: #c55a11; }
  input, select { padding: 3px; }
  button { padding: 4px 12px; cursor: pointer; }
  table { border: 1px solid #66cc66; border-collapse: separate; border-spacing: 2px; background: #ccffcc; }
  th { background: #99ee99; padding: 6px 20px; }
  td { padding: 2px; }
  td input[type=text] { width: 150px; }
</style>
</head>
<body>
<h2>Câu 27</h2>
<table id="bang">
  <thead>
    <tr><th>Số lượng</th><th>Đơn giá</th><th>Tổng</th><th>Chức năng</th></tr>
  </thead>
  <tbody>
    <tr>
      <td><input type="text" value="2" oninput="tinhTong(this)"></td>
      <td><input type="text" value="1000000" oninput="tinhTong(this)"></td>
      <td><input type="text" value="2000000" readonly></td>
      <td><button type="button" onclick="xoaDong(this)">Xóa</button></td>
    </tr>
    <tr>
      <td><input type="text" value="1" oninput="tinhTong(this)"></td>
      <td><input type="text" value="500000" oninput="tinhTong(this)"></td>
      <td><input type="text" value="500000" readonly></td>
      <td><button type="button" onclick="xoaDong(this)">Xóa</button></td>
    </tr>
  </tbody>
</table>
<script src="cau27.js"></script>
</body>
</html>
